    <link rel="canonical" href="https://portfolio-ravimishra.vercel.app/" />

    <meta property="og:description" content="Explore Ravi Kumar Mishra's portfolio, projects, skills, and experience as a Java Full Stack Developer." />

    <style>
      .initial-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #060814;
        color: #e2e8f0;
        font-family: Inter, Arial, sans-serif;
        text-align: center;
      }
      .initial-loader__spinner {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border: 4px solid rgba(96, 165, 250, .2);
        border-right-color: #34d399;
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: initial-loader-spin .8s linear infinite;
      }
      .initial-loader p { margin: 8px 0 0; color: #94a3b8; font-size: 14px; }
      @keyframes initial-loader-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" role="status" aria-live="polite">
        <div>
          <div class="initial-loader__spinner"></div>
          <strong>Loading portfolio</strong>
          <p>Please wait while the portfolio loads...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
